}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    height: 100%;
    background: transparent;
    font-family: var(--font-family);
    color: var(--text-main);
    overflow: hidden;
    user-select: none;
}
#widget-root {
    height: 100%;
    background: var(--bg-color);
    border: 2px solid var(--border-color);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow);
    position: relative;
    isolation: isolate;
}

#widget-root::before,
#widget-root::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.35s ease;
}

/* Header */
#header {
    background: var(--header-bg);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--border-color);
    -webkit-app-region: drag;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}
#header .date {
    font-weight: 800;
    font-size: 14px;
    color: var(--primary-color);
    font-family: var(--display-font-family);
    text-transform: var(--ui-text-transform);
    letter-spacing: var(--ui-letter-spacing);
}
#header .actions {
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
}
#header .actions button {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: var(--primary-color);
    padding: 2px 5px;
    border-radius: var(--radius);
}
#header .actions button:hover {
    background: var(--accent-color);
    color: var(--accent-contrast);
}

/* Tabs */
#tabs {
    display: flex;
    border-bottom: 2px solid var(--border-color);
    flex-shrink: 0;
    background: var(--card-bg);
    position: relative;
    z-index: 1;
}
#tabs button {
    flex: 1;
    padding: 8px 0;
    border: none;
    background: transparent;
    font-family: var(--font-family);
    font-weight: 700;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.15s;
}
#tabs button.active {
    color: var(--accent-contrast);
    background: var(--accent-color);
    border-bottom-color: var(--accent-color);
}
#tabs button:hover:not(.active) {
    background: rgba(0,0,0,0.03);
}

/* Content */
#content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    position: relative;
    z-index: 1;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
::-webkit-scrollbar-track { background: transparent; }
#content:not(:hover)::-webkit-scrollbar-thumb { background: transparent; }

/* Add task floating button */
.add-task-fab {
    position: absolute;
    bottom: 50px;
    right: 14px;
    width: 36px;
    height: 36px;
    background: var(--accent-color);
    border: 2px solid var(--border-color);
    border-radius: 50%;
    box-shadow: 2px 2px 0 0 var(--border-color);
    cursor: pointer;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    transition: all 0.15s;
}
.add-task-fab:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--border-color); }
.add-task-fab:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 0 var(--border-color); }

/* Add task popup */
.add-task-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.add-task-overlay.show { display: flex; }
.add-task-card {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    width: 100%;
    max-width: 340px;
}
.add-task-card h4 {
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 12px;
    text-transform: var(--ui-text-transform);
    letter-spacing: var(--ui-letter-spacing);
    font-family: var(--display-font-family);
}
.add-task-card input, .add-task-card select {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    background: var(--bg-color);
    font-family: var(--font-family);
    font-size: 12px;
    color: var(--text-main);
    margin-bottom: 10px;
    box-sizing: border-box;
}
.add-task-card .btn-row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}
.add-task-card .btn-sm {
    padding: 6px 14px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    font-family: var(--display-font-family);
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    background: var(--card-bg);
    color: var(--text-main);
    box-shadow: 2px 2px 0 0 var(--border-color);
    text-transform: var(--ui-text-transform);
    letter-spacing: var(--ui-letter-spacing);
}
.add-task-card .btn-sm:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 0 var(--border-color); }
.add-task-card .btn-sm.primary { background: var(--accent-color); color: var(--accent-contrast); }

/* Custom confirm dialog */
.confirm-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.confirm-overlay.show { display: flex; }
.confirm-card {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    width: 100%;
    max-width: 320px;
}
.confirm-card h3 {
    font-size: 14px;
    font-weight: 800;
    margin: 0 0 8px;
    text-transform: var(--ui-text-transform);
    letter-spacing: var(--ui-letter-spacing);
    font-family: var(--display-font-family);
}
.confirm-card p {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
}
.confirm-card .confirm-actions {
    display: flex;
    gap: 8px;
    flex-direction: column;
}
.confirm-card .confirm-actions .btn-sm {
    width: 100%;
    justify-content: center;
}

.widget-theme-switcher {
    position: absolute;
    top: 56px;
    right: 12px;
    width: min(270px, calc(100% - 24px));
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: calc(var(--radius) + 12px);
    box-shadow: var(--panel-shadow);
    padding: 12px;
    display: none;
    z-index: 180;
    max-height: calc(100% - 68px);
    overflow-y: auto;
    overscroll-behavior: contain;
}

.widget-theme-switcher.open {
    display: block;
}

.widget-theme-switcher::-webkit-scrollbar {
    width: 8px;
}

.widget-theme-switcher::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 999px;
    border: 2px solid var(--card-bg);
}

.widget-theme-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    background: var(--card-bg);
    z-index: 1;
}

.widget-theme-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.widget-theme-title strong {
    font-family: var(--display-font-family);
    font-size: 11px;
    text-transform: var(--ui-text-transform);
    letter-spacing: var(--ui-letter-spacing);
}

.widget-theme-title span {
    font-size: 11px;
    color: var(--text-secondary);
}

.widget-theme-mode {
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--theme-chip-bg);
    color: var(--theme-chip-color);
    font-size: 10px;
    font-weight: 700;
}

.widget-theme-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.widget-theme-option {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 2px solid var(--theme-option-border);
    border-radius: calc(var(--radius) + 8px);
    background: var(--bg-color);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
}

.widget-theme-option.active {
    background: var(--accent-color);
    color: var(--accent-contrast);
    border-color: var(--accent-color);
}

.widget-theme-option:hover {
    transform: translateY(-1px);
}

.widget-theme-preview {
    width: 34px;
    height: 34px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    padding: 3px;
    border: 2px solid var(--border-color);
    border-radius: calc(var(--radius) + 6px);
    flex-shrink: 0;
}

.widget-theme-preview span {
    border-radius: 5px;
}

.widget-theme-preview.pop-art {
    background: #ffde00;
}

.widget-theme-preview.pop-art span:nth-child(1) { background: #6fc2ff; }
.widget-theme-preview.pop-art span:nth-child(2) { background: #ff6b6b; }
.widget-theme-preview.pop-art span:nth-child(3) { background: #383838; }
.widget-theme-preview.pop-art span:nth-child(4) { background: #ffffff; }

.widget-theme-preview.pixel-art {
    background: #1a1a2e;
    border-radius: 0;
}

.widget-theme-preview.pixel-art span {
    border-radius: 0;
}

.widget-theme-preview.pixel-art span:nth-child(1) { background: #e94560; }
.widget-theme-preview.pixel-art span:nth-child(2) { background: #533483; }
.widget-theme-preview.pixel-art span:nth-child(3) { background: #0f3460; }
.widget-theme-preview.pixel-art span:nth-child(4) { background: #eeeeee; }

.widget-theme-preview.art-nouveau {
    background: linear-gradient(135deg, #f4f1e8, #fbf7ef);
}

.widget-theme-preview.art-nouveau span:nth-child(1) { background: #2d5016; }
.widget-theme-preview.art-nouveau span:nth-child(2) { background: #d4af37; }
.widget-theme-preview.art-nouveau span:nth-child(3) { background: #8b6f47; }

/* Custom select (compact, for widget) */
.w-custom-select {
    position: relative;
    width: 100%;
}
.w-custom-select-trigger {
    width: 100%;
    padding: 7px 28px 7px 8px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    background: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-family);
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20width%3D%2216%22%20height%3D%2216%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%2C9%2012%2C15%2018%2C9%22%20/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 6px center;
    background-size: 14px;
}
.w-custom-select-trigger:hover {
    background: var(--card-bg);
}
.w-custom-select.open .w-custom-select-trigger {
    border-color: var(--accent-color);
}
.w-custom-select-options {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: 4px 4px 0 0 var(--border-color);
    z-index: 200;
    display: none;
    max-height: 180px;
    overflow-y: auto;
}
.w-custom-select.open .w-custom-select-options {
    display: block;
}
.w-custom-select-option {
    padding: 6px 10px;
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.1s;
}
.w-custom-select-option:last-child { border-bottom: none; }
.w-custom-select-option:hover { background: var(--accent-color); color: var(--accent-contrast); }
.w-custom-select-option.selected { background: var(--bg-color); }
.w-custom-select-option.selected::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    font-size: 9px;
    margin-left: auto;
}
.w-custom-select-divider {
    padding: 4px 10px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-color);
    letter-spacing: 0.5px;
}

/* Widget transparency transition */
#widget-root { transition: opacity 0.3s ease; }

/* widget idea card delete button */
.widget-idea-card { position: relative; }
.widget-idea-del {
    position: absolute;
    top: 4px;
    right: 6px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.7rem;
    padding: 2px 4px;
    opacity: 0;
    transition: opacity 0.15s;
}
.widget-idea-card:hover .widget-idea-del { opacity: 1; }
.widget-idea-del:hover { color: var(--danger-color); }

/* Section panels */
.panel { display: none; }
.panel.active { display: block; }

/* Task item */
.task-item {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-bottom: 8px;
    box-shadow: 3px 3px 0 0 var(--border-color);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    transition: all 0.15s;
    cursor: default;
    position: relative;
}
.task-item:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 0 var(--border-color);
}
.task-item.done {
    opacity: 0.5;
}
.task-item.done .task-name {
    text-decoration: line-through;
}
.task-item.overdue {
    border-left: 4px solid var(--danger-color);
}
.task-check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    background: var(--card-bg);
}
.task-check:hover { border-color: var(--accent-color); }
.task-check.checked {
    background: var(--accent-color);
    border-color: var(--accent-color);
}
.task-check.checked::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    font-size: 10px;
    color: white;
}
.task-info { flex: 1; min-width: 0; }
.task-name {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.3;
    word-break: break-word;
}
.task-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 11px;
    color: var(--text-secondary);
    flex-wrap: wrap;
}
.task-meta .priority-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}
.task-meta .group-tag {
    background: var(--accent-color);
    color: white;
    padding: 1px 6px;
    border-radius: var(--radius);
    font-size: 10px;
    font-weight: 600;
}
.task-meta .ddl {
    font-weight: 600;
}
.task-meta .ddl.overdue {
    color: var(--danger-color);
}

/* Project card */
.project-card {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: 3px 3px 0 0 var(--border-color);
    cursor: pointer;
    transition: all 0.15s;
}
.project-card:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 0 var(--border-color);
}
.project-card .expand-icon {
    font-size: 10px;
    transition: transform 0.2s;
    margin-left: 6px;
}
.project-card.expanded .expand-icon {
    transform: rotate(90deg);
}
.project-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.project-name .status {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
}
.progress-bar {
    height: 8px;
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 4px;
}
.progress-fill {
    height: 100%;
    background: var(--accent-color);
    transition: width 0.3s;
}
.project-meta {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
}
.project-tasks {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-color);
}
.project-card.expanded .project-tasks {
    display: block;
}
.project-tasks .task-item {
    box-shadow: none;
    border-width: 1px;
    padding: 6px 8px;
    margin-bottom: 4px;
}
.project-tasks .task-item:last-child {
    margin-bottom: 0;
}

/* Daily plan item */
.plan-item {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-bottom: 8px;
    box-shadow: 3px 3px 0 0 var(--border-color);
    display: flex;
    align-items: center;
    gap: 8px;
}
.plan-item.done { opacity: 0.5; }
.plan-item.done .plan-text { text-decoration: line-through; }
.plan-time {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-color);
    white-space: nowrap;
    margin-left: auto;
}
.plan-text {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
    word-break: break-word;
}

/* Empty state */
.empty {
    text-align: center;
    padding: 30px 10px;
    color: var(--text-secondary);
    font-size: 13px;
}
.empty i { font-size: 28px; margin-bottom: 8px; display: block; opacity: 0.4; }

/* Footer */
#footer {
    border-top: 2px solid var(--border-color);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    flex-shrink: 0;
}
#footer .sync-status {
    font-size: 11px;
    color: var(--text-secondary);
}
#footer .open-btn {
    background: var(--accent-color);
    color: white;
    border: 2px solid var(--border-color);
    padding: 4px 12px;
    font-family: var(--font-family);
    font-weight: 700;
    font-size: 11px;
    border-radius: var(--radius);
    cursor: pointer;
    box-shadow: 2px 2px 0 0 var(--border-color);
}
#footer .open-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 0 var(--border-color);
}
#footer .open-btn:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 0 var(--border-color);
}

/* Loading */
.loading {
    text-align: center;
    padding: 40px;
    color: var(--text-secondary);
}
.loading i { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Count badge */
.count-badge {
    background: var(--danger-color);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 0 5px;
    border-radius: 10px;
    margin-left: 4px;
}

/* Subtasks in widget */
.task-subtasks {
    margin-top: 4px;
    padding-left: 2px;
}
.task-subtasks .subtask-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-secondary);
    padding: 1px 0;
}
.task-subtasks .subtask-row.st-done .st-text {
    text-decoration: line-through;
    opacity: 0.5;
}
.task-subtasks .st-check {
    width: 12px;
    height: 12px;
    border: 1.5px solid var(--border-color);
    border-radius: 2px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-bg);
}
.task-subtasks .st-check.checked {
    background: var(--accent-color);
    border-color: var(--accent-color);
}
.task-subtasks .st-check.checked::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    font-size: 7px;
    color: white;
}
.task-meta .priority-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 0 5px;
    border-radius: var(--radius);
    border: 1px solid;
}
.task-meta .priority-tag.high {
    color: var(--danger-color);
    border-color: var(--danger-color);
}
.task-meta .priority-tag.medium {
    color: var(--warning-color);
    border-color: var(--warning-color);
}
.task-meta .priority-tag.low {
    color: var(--success-color);
    border-color: var(--success-color);
}
.subtask-summary {
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
}
.subtask-summary:hover {
    color: var(--accent-color);
}
.subtask-summary .st-bar {
    height: 4px;
    flex: 1;
    max-width: 60px;
    background: var(--bg-color);
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}
.subtask-summary .st-bar-fill {
    height: 100%;
    background: var(--accent-color);
    transition: width 0.3s;
}

/* Overdue collapsible section */
.overdue-section {
    margin-top: 10px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: 3px 3px 0 0 var(--border-color);
    overflow: hidden;
}
.overdue-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: var(--card-bg);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: var(--danger-color);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
}
.overdue-header:hover {
    background: rgba(255,107,107,0.05);
}
.overdue-section.expanded .overdue-header {
    border-bottom-color: var(--border-color);
}
.overdue-header .overdue-icon {
    font-size: 10px;
    transition: transform 0.2s;
}
.overdue-section.expanded .overdue-header .overdue-icon {
    transform: rotate(90deg);
}
.overdue-body {
    display: none;
    padding: 8px;
}
.overdue-section.expanded .overdue-body {
    display: block;
}
.overdue-body .task-item {
    box-shadow: none;
    border-width: 1px;
}

.group-banner {
    border: 2px solid var(--border-color);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 3px 3px 0 0 var(--border-color);
}
.group-banner-header {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    background: var(--card-bg);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
}
.group-banner-header:hover {
    background: var(--bg-color);
}
.group-banner.expanded .group-banner-header {
    border-bottom-color: var(--border-color);
}
.group-banner-color {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    border: 2px solid var(--border-color);
    flex-shrink: 0;
}
.group-banner-header .expand-arrow {
    font-size: 9px;
    margin-left: auto;
    transition: transform 0.2s;
}
.group-banner.expanded .group-banner-header .expand-arrow {
    transform: rotate(90deg);
}
.group-banner-header .g-count {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--theme-chip-bg);
    color: var(--theme-chip-color);
}
.group-banner-body {
    display: none;
    padding: 6px;
}
.group-banner.expanded .group-banner-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.group-banner-body .task-item {
    box-shadow: none;
    border-width: 1px;
    margin-bottom: 0;
}
</style>
</head>

<script>
const fs = require('fs');
const path = require('path');
const { ipcRenderer } = require('electron');

const SUPABASE_URL = 'https://gcrdheovyzjywwyijjli.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjcmRoZW92eXpqeXd3eWlqamxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NzQxMDIsImV4cCI6MjA4MjE1MDEwMn0.7bhn24n_-HMPbN_IeTb6cZNrzH3-GFkKtxv0imkOSBM';
let _widCounter = 0;
function wUniqueId() { return Date.now() * 1000 + (++_widCounter % 1000); }

const DATA_DIR = path.join(process.env.APPDATA || '', 'ProLife');
const DATA_FILE = path.join(DATA_DIR, 'widget-data.json');

let data = { todos: [], projects: [], dailyPlans: [], groups: [], auth: {} };
let pinned = true;
const THEME_STYLE_META = {
    'pop-art': {
        label: '波普风',
        modeLabels: { light: '亮色模式', dark: '暗色模式' }
    },
    'pixel-art': {
        label: '像素风',
        modeLabels: { light: '像素亮色', dark: '像素暗色' }
    },
    'art-nouveau': {
        label: '新艺术',
        modeLabels: { light: '新艺术亮色', dark: '新艺术暗色' }
    },
    'ink-wash': {
        label: '水墨风',
        modeLabels: { light: '水墨亮色', dark: '水墨暗色' }
    },
    'swiss': {
        label: '瑞士国际风',
        modeLabels: { light: '瑞士亮色', dark: '瑞士暗色' }
    },
    'vaporwave': {
        label: '蒸汽波',
        modeLabels: { light: '蒸汽波亮色', dark: '蒸汽波暗色' }
    },
    'brutalist': {
        label: '粗野主义',
        modeLabels: { light: '粗野亮色', dark: '粗野暗色' }
    }
};

const THEME_STYLE_ALIASES = {
    'risograph': 'ink-wash',
    'glassmorphism': 'vaporwave'
};

function normalizeThemeStyle(style) {
    const normalized = THEME_STYLE_ALIASES[style] || style;
    return THEME_STYLE_META[normalized] ? normalized : 'pop-art';
}

function getStoredThemeStyle() {
    return normalizeThemeStyle(localStorage.getItem('themeStyle'));
}

function getStoredThemeMode() {
    const stored = localStorage.getItem('themeMode');
    if (stored === 'light' || stored === 'dark') return stored;
    const legacy = localStorage.getItem('theme');
    if (legacy === 'light' || legacy === 'dark') return legacy;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

let themeState = {
    style: getStoredThemeStyle(),
    mode: getStoredThemeMode()
};

function getThemePrefs() {
    return {
        style: themeState.style,
        mode: themeState.mode
    };
}

function persistThemePrefs() {
    localStorage.setItem('themeStyle', themeState.style);
    localStorage.setItem('themeMode', themeState.mode);
    localStorage.setItem('theme', themeState.mode === 'dark' ? 'dark' : 'light');
}

function updateThemeUI() {
    document.getElementById('themeIcon').className = themeState.mode === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    document.getElementById('widgetThemeMode').textContent = THEME_STYLE_META[themeState.style].modeLabels[themeState.mode];
    document.querySelectorAll('.widget-theme-option').forEach(option => {
        option.classList.toggle('active', option.dataset.themeStyle === themeState.style);
    });
}

function applyTheme(options = {}) {
    const { persist = false, sync = false } = options;
    document.body.dataset.theme = themeState.style;
    document.body.classList.toggle('dark-mode', themeState.mode === 'dark');
    updateThemeUI();

    if (persist) {
        persistThemePrefs();
    }

    if (sync) {
        saveLocalData();
        ipcRenderer.send('widget-data-changed');
    }
}

function toggleThemePanel(forceOpen) {
    const panel = document.getElementById('widgetThemePanel');
    const nextState = typeof forceOpen === 'boolean' ? forceOpen : !panel.classList.contains('open');
    panel.classList.toggle('open', nextState);
}

function setThemeStyle(style) {
    if (!THEME_STYLE_META[style] || themeState.style === style) return;
    themeState.style = style;
    applyTheme({ persist: true, sync: true });
    toggleThemePanel(false);
}

// --- 初始化 ---
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    updateDate();
    refreshData();
    document.querySelectorAll('.widget-theme-option').forEach(option => {
        option.addEventListener('click', () => setThemeStyle(option.dataset.themeStyle));
    });
    document.addEventListener('click', (event) => {
        const panel = document.getElementById('widgetThemePanel');
        if (panel && panel.classList.contains('open') && !panel.contains(event.target)) {
            toggleThemePanel(false);
        }
    });
    // 每60秒自动刷新
    setInterval(() => {
        if (document.visibilityState === 'visible') refreshData();
    }, 60000);
    // 监听主应用数据变更通知
    ipcRenderer.on('refresh-widget-data', () => {
        refreshData();
    });
});

function updateDate() {
    const now = new Date();
    const days = ['日','一','二','三','四','五','六'];
    document.getElementById('headerDate').textContent =
        `${now.getMonth()+1}月${now.getDate()}日 周${days[now.getDay()]}`;
}

// --- 主题 ---
function initTheme() {
    applyTheme({ persist: true });
}

function toggleDark() {
    themeState.mode = themeState.mode === 'dark' ? 'light' : 'dark';
    applyTheme({ persist: true, sync: true });
}

function togglePin() {
    pinned = !pinned;
    ipcRenderer.send('widget-toggle-top', pinned);
    document.getElementById('pinIcon').style.opacity = pinned ? '1' : '0.4';
}

// --- Tab 切换 ---
function switchTab(tab, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    btn.classList.add('active');
    if (tab === 'tasks') renderTasks();
    else if (tab === 'projects') renderProjects();
    else if (tab === 'plans') renderPlans();
    else if (tab === 'ideas') renderWidgetIdeas();
}

// --- 数据加载 ---
function refreshData() {
    document.getElementById('syncStatus').textContent = '刷新中...';
    // 优先读本地文件
    let loaded = loadLocalData();
    if (loaded) {
        renderAll();
        document.getElementById('syncStatus').textContent = '本地数据 ' + formatTime(data.updatedAt);
    }
    // 尝试从云端刷新
    loadCloudData().then(ok => {
        if (ok) {
            renderAll();
            document.getElementById('syncStatus').textContent = '已同步 ' + formatTime(new Date().toISOString());
        } else if (!loaded) {
            document.getElementById('syncStatus').textContent = '无数据';
            renderAll();
        }
    });
}

function loadLocalData() {
    try {
        if (fs.existsSync(DATA_FILE)) {
            const raw = fs.readFileSync(DATA_FILE, 'utf-8');
            const parsed = JSON.parse(raw);
            data = { ...data, ...parsed, _loaded: true };
            const syncedThemeStyle = normalizeThemeStyle(parsed.themePrefs?.style);
            if (parsed.themePrefs && THEME_STYLE_META[syncedThemeStyle]) {
                themeState.style = syncedThemeStyle;
                if (parsed.themePrefs.mode === 'light' || parsed.themePrefs.mode === 'dark') {
                    themeState.mode = parsed.themePrefs.mode;
                }
                applyTheme({ persist: true });
            }
            return true;
        }
    } catch(e) { console.warn('[Local]', e); }
    return false;
}

async function loadCloudData() {
    if (!data.auth || !data.auth.access_token || !data.auth.user_id) return false;
    try {
        // 先尝试刷新 token
        let token = data.auth.access_token;
        if (data.auth.refresh_token) {
            try {
                const refreshRes = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                    body: JSON.stringify({ refresh_token: data.auth.refresh_token })
                });
                if (refreshRes.ok) {
                    const refreshData = await refreshRes.json();
                    token = refreshData.access_token;
                    data.auth.access_token = token;
                    data.auth.refresh_token = refreshData.refresh_token || data.auth.refresh_token;
                }
            } catch(e) { console.warn('[Cloud] Token refresh failed:', e.message); }
        }

        const res = await fetch(`${SUPABASE_URL}/rest/v1/user_data?id=eq.${data.auth.user_id}`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const arr = await res.json();
            if (arr && arr[0]) {
                data.todos = arr[0].todos || [];
                data.projects = arr[0].projects || [];
                data.dailyPlans = arr[0].dailyPlans || [];
                data.groups = arr[0].groups || [];
                data.ideas = arr[0].ideas || [];
                data.ideaTags = arr[0].ideaTags || [];
                data._loaded = true;
                // 写回本地
                saveLocalData();
                return true;
            }
        }
    } catch(e) { console.warn('[Cloud]', e); }
    return false;
}

function saveLocalData() {
    try {
        if (!fs.existsSync(DATA_DIR)) fs.mkdirSync(DATA_DIR, { recursive: true });
        let current = {};
        if (fs.existsSync(DATA_FILE)) {
            try {
                current = JSON.parse(fs.readFileSync(DATA_FILE, 'utf-8'));
            } catch (e) {}
        }

        const merged = { ...current, ...data };
        // 仅当数据尚未从文件加载时，防止空数组覆盖已有数据
        if (!data._loaded) {
            ['todos', 'projects', 'dailyPlans', 'groups'].forEach(key => {
                if (Array.isArray(data[key]) && data[key].length === 0 && Array.isArray(current[key]) && current[key].length > 0) {
                    merged[key] = current[key];
                }
            });
        }
        if ((!data.auth || !data.auth.access_token) && current.auth) {
            merged.auth = current.auth;
        }

        fs.writeFileSync(DATA_FILE, JSON.stringify({
            ...merged,
            themePrefs: getThemePrefs(),
            updatedAt: new Date().toISOString()
        }));
    } catch(e) { console.warn('[Save]', e); }
}

async function syncToggleToCloud(todoId, done) {
    if (!data.auth || !data.auth.access_token || !data.auth.user_id) return;
    try {
        const payload = {
            id: data.auth.user_id,
            todos: data.todos,
            projects: data.projects,
            dailyPlans: data.dailyPlans,
            groups: data.groups,
            ideas: data.ideas || [],
            ideaTags: data.ideaTags || [],
            updated_at: new Date().toISOString()
        };
        await fetch(`${SUPABASE_URL}/rest/v1/user_data?id=eq.${data.auth.user_id}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${data.auth.access_token}`,
                'Prefer': 'return=representation'
            },
            body: JSON.stringify(payload)
        });
    } catch(e) { console.warn('[Sync]', e); }
}

function renderAll() {
    const activePanel = document.querySelector('.panel.active');
    const activeId = activePanel ? activePanel.id : '';
    if (activeId === 'panel-tasks') renderTasks();
    else if (activeId === 'panel-projects') renderProjects();
    else if (activeId === 'panel-plans') renderPlans();
    else if (activeId === 'panel-ideas') renderWidgetIdeas();
}

function renderTasks() {
    const panel = document.getElementById('panel-tasks');
    const today = new Date().toISOString().slice(0, 10);
    const now = new Date();
    now.setHours(0,0,0,0);

    const todayTasks = (data.todos || []).filter(t => {
        if (t.projectId) return false;
        if (!t.completed && (!t.date || t.date >= today)) return true;
        if (t.completed && (!t.date || t.date === today) && t.updatedAt && t.updatedAt.slice(0, 10) === today) return true;
        return false;
    });

    const overdueTasks = (data.todos || []).filter(t => {
        if (t.projectId) return false;
        if (t.completed) return false;
        if (t.date && t.date < today) return true;
        return false;
    });

    const countEl = document.getElementById('taskCount');
    const pendingCount = todayTasks.filter(t => !t.completed).length + overdueTasks.length;

    if (todayTasks.length === 0 && overdueTasks.length === 0) {
        panel.innerHTML = '<div class="empty"><i class="fas fa-check-circle"></i>没有待办任务</div>';
        countEl.style.display = 'none';
        return;
    }

    countEl.textContent = pendingCount;
    countEl.style.display = pendingCount > 0 ? 'inline' : 'none';

    const priOrder = { high: 0, medium: 1, low: 2 };
    const sortFn = (a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        const pa = priOrder[a.priority] ?? 1;
        const pb = priOrder[b.priority] ?? 1;
        if (pa !== pb) return pa - pb;
        return (a.startTime || '').localeCompare(b.startTime || '');
    };

    function buildGroupHtml(tasks) {
        const groupMap = new Map();
        tasks.forEach(t => {
            const key = t.groupId || 'none';
            const group = (data.groups || []).find(g => g.id === t.groupId);
            const label = group ? group.name : '未分组';
            const color = group ? group.color : '#3b82f6';
            if (!groupMap.has(key)) groupMap.set(key, { label, color, tasks: [] });
            groupMap.get(key).tasks.push(t);
        });
        const groups = [...groupMap.values()].sort((a, b) => {
            const ua = a.tasks.filter(t => !t.completed).length;
            const ub = b.tasks.filter(t => !t.completed).length;
            return ub - ua;
        });
        let html = '';
        groups.forEach(g => {
            g.tasks.sort(sortFn);
            const pending = g.tasks.filter(t => !t.completed).length;
            const expanded = pending > 0 ? ' expanded' : '';
            const tasksHtml = g.tasks.map(t => buildTaskItemHtml(t, now)).join('');
            html += `<div class="group-banner${expanded}">
                <div class="group-banner-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <div class="group-banner-color" style="background:${g.color}"></div>
                    <i class="fas fa-folder" style="color:${g.color};font-size:10px;"></i>
                    <span>${g.label}</span>
                    <span class="g-count">${g.tasks.length}${pending > 0 ? ` · ${pending}待办` : ''}</span>
                    <i class="fas fa-chevron-right expand-arrow"></i>
                </div>
                <div class="group-banner-body">${tasksHtml}</div>
            </div>`;
        });
        return html;
    }

    let html = '';
    if (todayTasks.length > 0) {
        html += `<div class="overdue-section expanded">
            <div class="overdue-header" onclick="this.parentElement.classList.toggle('expanded')">
                <i class="fas fa-chevron-right overdue-icon" style="transform:rotate(90deg);"></i>
                <i class="fas fa-calendar-day" style="color:var(--warning-color);"></i> 今日
                <span class="count-badge">${todayTasks.length}</span>
            </div>
            <div class="overdue-body" onclick="event.stopPropagation()">${buildGroupHtml(todayTasks)}</div>
        </div>`;
    }
    if (overdueTasks.length > 0) {
        html += `<div class="overdue-section">
            <div class="overdue-header" onclick="this.parentElement.classList.toggle('expanded')">
                <i class="fas fa-chevron-right overdue-icon"></i>
                <i class="fas fa-exclamation-circle"></i> 已超时
                <span class="count-badge" style="background:var(--danger-color)">${overdueTasks.length}</span>
            </div>
            <div class="overdue-body" onclick="event.stopPropagation()">${buildGroupHtml(overdueTasks)}</div>
        </div>`;
    }

    panel.innerHTML = html;
}

function buildTaskItemHtml(t, now) {
    const isOverdue = t.date && new Date(t.date) < now;
    const group = (data.groups || []).find(g => g.id === t.groupId);
    const groupName = group ? group.name : '';
    const groupColor = group ? group.color : 'var(--accent-color)';

    let ddlText = '';
    if (t.date) {
        const d = new Date(t.date);
        ddlText = `${d.getMonth()+1}/${d.getDate()}`;
        if (t.time) ddlText += ' ' + t.time;
    }

    const priLabels = { high: '高', medium: '中', low: '低' };
    const priLabel = priLabels[t.priority] || '中';
    const priClass = t.priority || 'medium';

    let subtasksHtml = '';
    if (t.subtasks && t.subtasks.length > 0) {
        const stDone = t.subtasks.filter(st => st.completed).length;
        const stTotal = t.subtasks.length;
        const stPct = Math.round(stDone / stTotal * 100);
        const hasIncomplete = stDone < stTotal;
        subtasksHtml = `
            <div class="subtask-summary" onclick="event.stopPropagation();toggleTaskSubtasks(this)">
                <i class="fas fa-chevron-right" style="font-size:8px;transition:transform 0.2s;${hasIncomplete ? 'transform:rotate(90deg);' : ''}"></i>
                <i class="fas fa-tasks" style="font-size:9px;"></i> ${stDone}/${stTotal}
                <div class="st-bar"><div class="st-bar-fill" style="width:${stPct}%"></div></div>
            </div>
            <div class="task-subtasks" style="display:${hasIncomplete ? 'block' : 'none'};">
                ${t.subtasks.map(st => `
                    <div class="subtask-row ${st.completed ? 'st-done' : ''}">
                        <div class="st-check ${st.completed ? 'checked' : ''}" onclick="event.stopPropagation();toggleSubtask('${t.id}','${st.id}')"></div>
                        <span class="st-text">${escHtml(st.text)}</span>
                    </div>
                `).join('')}
            </div>`;
    }

    return `<div class="task-item ${t.completed ? 'done' : ''} ${isOverdue ? 'overdue' : ''}">
        <div class="task-check ${t.completed ? 'checked' : ''}" onclick="toggleTodo('${t.id}')"></div>
        <div class="task-info">
            <div class="task-name">${escHtml(t.text)}</div>
            <div class="task-meta">
                <span class="priority-tag ${priClass}">${priLabel}</span>
                ${ddlText ? `<span class="ddl ${isOverdue ? 'overdue' : ''}">${ddlText}</span>` : ''}
                ${groupName ? `<span class="group-tag" style="background:${groupColor}">${escHtml(groupName)}</span>` : ''}
            </div>
            ${subtasksHtml}
        </div>
    </div>`;
}

function renderProjects() {
    const panel = document.getElementById('panel-projects');
    const projects = data.projects || [];

    if (projects.length === 0) {
        panel.innerHTML = '<div class="empty"><i class="fas fa-folder-open"></i>没有项目</div>';
        return;
    }

    let html = '';
    projects.forEach(p => {
        // 从 todos 中查找属于该项目的任务
        const tasks = (data.todos || []).filter(t => String(t.projectId) == String(p.id));
        const done = tasks.filter(t => t.completed).length;
        const total = tasks.length;
        const pct = total > 0 ? Math.round(done / total * 100) : 0;

        let statusText = '进行中';
        let statusColor = 'var(--accent-color)';
        if (pct === 100 && total > 0) { statusText = '已完成'; statusColor = 'var(--success-color)'; }
        else if (p.status === 'completed') { statusText = '已完成'; statusColor = 'var(--success-color)'; }
        else if (p.status === 'paused') { statusText = '暂停'; statusColor = 'var(--warning-color)'; }

        let ddlText = '';
        if (p.deadline) {
            const d = new Date(p.deadline);
            ddlText = `${d.getMonth()+1}/${d.getDate()}`;
            if (new Date(p.deadline) < new Date()) ddlText = `<span style="color:var(--danger-color)">${ddlText} 逾期</span>`;
        }

        // 渲染项目下的任务列表

        if (tasks.length > 0) {
            const pending = tasks.filter(t => !t.completed);

            sortedTasks.forEach(t => {
                const priLabels = { high: '高', medium: '中', low: '低' };
                const priLabel = priLabels[t.priority] || '中';
                const priClass = t.priority || 'medium';

                let stHtml = '';
                if (t.subtasks && t.subtasks.length > 0) {
                    const stDone = t.subtasks.filter(st => st.completed).length;

                    const stPct = Math.round(stDone / stTotal * 100);
                    const hasIncomplete = stDone < stTotal;
                    stHtml = `
                        <div class="subtask-summary" onclick="event.stopPropagation();toggleTaskSubtasks(this)">

                                <div class="subtask-row ${st.completed ? 'st-done' : ''}">
                                    <div class="st-check ${st.completed ? 'checked' : ''}" onclick="event.stopPropagation();toggleSubtask('${t.id}','${st.id}')"></div>
                                    <span class="st-text">${escHtml(st.text)}</span>
                                </div>
                            `).join('')}
                        </div>`;
                }

                tasksHtml += `<div class="task-item ${t.completed ? 'done' : ''}" onclick="event.stopPropagation();openTaskInMain('${t.id}','${p.id}')" style="cursor:pointer;" title="点击查看详情">
                    <div class="task-check ${t.completed ? 'checked' : ''}" onclick="event.stopPropagation();toggleTodo('${t.id}')"></div>
                    <div class="task-info">
                        <div class="task-name">${escHtml(t.text)}</div>
                        <div class="task-meta">
                            <span class="priority-tag ${priClass}">${priLabel}</span>
                            ${t.date ? `<span class="ddl">${new Date(t.date).getMonth()+1}/${new Date(t.date).getDate()}</span>` : ''}
                        </div>
                        ${stHtml}
                    </div>
                    <i class="fas fa-external-link-alt" style="font-size:9px;color:var(--text-secondary);margin-left:4px;flex-shrink:0;"></i>
                </div>`;
            });
        } else {
            tasksHtml = '<div style="text-align:center;color:var(--text-secondary);font-size:11px;padding:6px 0;">暂无任务</div>';
        }

        // 项目默认折叠
        html += `<div class="project-card" onclick="toggleProjectExpand(this)">
            <div class="project-name">
                <span><i class="fas fa-chevron-right expand-icon"></i> ${escHtml(p.name)}</span>
                <span class="status" style="color:${statusColor};border-color:${statusColor}">${statusText}</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${statusColor}"></div></div>
            <div class="project-meta">
                <span>${done}/${total} 任务 (${pct}%)</span>
                ${ddlText ? `<span>${ddlText}</span>` : ''}
            </div>
            <div class="project-tasks">${tasksHtml}</div>
        </div>`;
    });
    panel.innerHTML = html;
}

// --- 交互 ---
function toggleTodo(id) {
    const todo = data.todos.find(t => String(t.id) === String(id));
    if (!todo) return;
    todo.completed = !todo.completed;
    todo.updatedAt = new Date().toISOString();
    saveLocalData();
    renderAll();
    syncToggleToCloud();
    // 通知主应用刷新
    ipcRenderer.send('widget-data-changed');
}

function togglePlan(id) {
    const plan = data.dailyPlans.find(p => String(p.id) === String(id));
    if (!plan) return;
    plan.completed = !plan.completed;
    saveLocalData();
    renderPlans();
    syncToggleToCloud();
    // 通知主应用刷新
    ipcRenderer.send('widget-data-changed');
}

function toggleTaskSubtasks(el) {
    const subtasksDiv = el.nextElementSibling;
    const icon = el.querySelector('.fa-chevron-right');
    if (subtasksDiv.style.display === 'none') {
        subtasksDiv.style.display = 'block';
        if (icon) icon.style.transform = 'rotate(90deg)';
    } else {
        subtasksDiv.style.display = 'none';
        if (icon) icon.style.transform = '';
    }
}

function toggleSubtask(todoId, subtaskId) {
    const todo = data.todos.find(t => String(t.id) === String(todoId));
    if (!todo || !todo.subtasks) return;
    const st = todo.subtasks.find(s => String(s.id) === String(subtaskId));
    if (!st) return;
    st.completed = !st.completed;
    saveLocalData();
    renderTasks();
    syncToggleToCloud();
    // 通知主应用刷新
    ipcRenderer.send('widget-data-changed');
}

        ipcRenderer.send('widget-open-project-task-detail', {
            projectId: parseInt(projectId) || projectId,
            taskId: parseInt(taskId) || taskId
        });
    } else {
        ipcRenderer.send('widget-open-task-detail', parseInt(taskId) || taskId);
    }
}

// --- 添加任务 ---
// --- 小组件自定义下拉 ---
function populateWidgetGroupSelect(customId, nativeId, defaultText) {
    const customSel = document.getElementById(customId);
    const nativeSel = document.getElementById(nativeId);
    const optionsContainer = customSel.querySelector('.w-custom-select-options');
    const trigger = customSel.querySelector('.w-custom-select-trigger');
    optionsContainer.innerHTML = '';
    nativeSel.innerHTML = `<option value="">${defaultText}</option>`;

    const noneDiv = document.createElement('div');
    noneDiv.className = 'w-custom-select-option';
    noneDiv.dataset.value = '';
    noneDiv.innerHTML = '<span style="color:var(--text-secondary);">无关联</span>';
    noneDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        trigger.innerHTML = defaultText;
        trigger.dataset.value = '';
        nativeSel.value = '';
        optionsContainer.querySelectorAll('.w-custom-select-option').forEach(o => o.classList.remove('selected'));
        noneDiv.classList.add('selected');
        customSel.classList.remove('open');
    });
    optionsContainer.appendChild(noneDiv);

    if ((data.groups || []).length > 0) {
        const gd = document.createElement('div');
        gd.className = 'w-custom-select-divider';
        gd.innerHTML = '分组';
        optionsContainer.appendChild(gd);
        (data.groups || []).forEach(g => {
            const val = `g_${g.id}`;
            const opt = document.createElement('option');
            opt.value = val; opt.innerText = g.name;
            nativeSel.appendChild(opt);
            const div = document.createElement('div');
            div.className = 'w-custom-select-option';
            div.dataset.value = val;
            div.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;border:1.5px solid var(--border-color);background:${g.color};flex-shrink:0;"></span> ${escHtml(g.name)}`;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                trigger.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;border:1.5px solid var(--border-color);background:${g.color};flex-shrink:0;margin-right:4px;"></span>${escHtml(g.name)}`;
                trigger.dataset.value = val;
                nativeSel.value = val;
                optionsContainer.querySelectorAll('.w-custom-select-option').forEach(o => o.classList.remove('selected'));
                div.classList.add('selected');
                customSel.classList.remove('open');
            });
            optionsContainer.appendChild(div);
        });
    }
    if ((data.projects || []).length > 0) {
        const pd = document.createElement('div');
        pd.className = 'w-custom-select-divider';
        pd.innerHTML = '项目';
        optionsContainer.appendChild(pd);
        (data.projects || []).forEach(p => {
            const val = `p_${p.id}`;
            const opt = document.createElement('option');
            opt.value = val; opt.innerText = p.name;
            nativeSel.appendChild(opt);
            const div = document.createElement('div');
            div.className = 'w-custom-select-option';
            div.dataset.value = val;
            div.innerHTML = `<i class="fas fa-project-diagram" style="font-size:10px;color:${p.color};"></i> ${escHtml(p.name)}`;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                trigger.innerHTML = `<i class="fas fa-project-diagram" style="font-size:10px;color:${p.color};margin-right:3px;"></i>${escHtml(p.name)}`;
                trigger.dataset.value = val;
                nativeSel.value = val;
                optionsContainer.querySelectorAll('.w-custom-select-option').forEach(o => o.classList.remove('selected'));
                div.classList.add('selected');
                customSel.classList.remove('open');
            });
            optionsContainer.appendChild(div);
        });
    }

    if (!customSel._wInitDone) {
        customSel._wInitDone = true;
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.w-custom-select.open').forEach(s => { if (s !== customSel) s.classList.remove('open'); });
            customSel.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!customSel.contains(e.target)) customSel.classList.remove('open');
        });
    }

    trigger.innerHTML = defaultText;
    trigger.dataset.value = '';
    nativeSel.value = '';
    optionsContainer.querySelectorAll('.w-custom-select-option').forEach(o => o.classList.remove('selected'));
    const noneTarget = optionsContainer.querySelector('[data-value=""]');
    if (noneTarget) noneTarget.classList.add('selected');
}

function populateWidgetPrioritySelect() {
    const customSel = document.getElementById('widgetTaskPriorityCustom');
    const nativeSel = document.getElementById('widgetTaskPriority');
    const optionsContainer = customSel.querySelector('.w-custom-select-options');
    const trigger = customSel.querySelector('.w-custom-select-trigger');

    if (customSel._wInitDone) return; // static options, init once
    customSel._wInitDone = true;

    const priorities = [
        { value: 'high', label: '高优先级', icon: 'fa-circle', color: 'var(--danger-color)' },
        { value: 'medium', label: '中优先级', icon: 'fa-circle', color: 'var(--warning-color)' },
        { value: 'low', label: '低优先级', icon: 'fa-circle', color: 'var(--success-color)' }
    ];

    priorities.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'w-custom-select-option';
        div.dataset.value = p.value;
        div.innerHTML = `<i class="fas ${p.icon}" style="font-size:7px;color:${p.color};"></i> ${p.label}`;
        div.addEventListener('click', (e) => {
            e.stopPropagation();
            trigger.innerHTML = `<i class="fas ${p.icon}" style="font-size:7px;color:${p.color};"></i> ${p.label}`;
            trigger.dataset.value = p.value;
            nativeSel.value = p.value;
            optionsContainer.querySelectorAll('.w-custom-select-option').forEach(o => o.classList.remove('selected'));
            div.classList.add('selected');
            customSel.classList.remove('open');
        });
        optionsContainer.appendChild(div);
    });

    trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.w-custom-select.open').forEach(s => { if (s !== customSel) s.classList.remove('open'); });
        customSel.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
        if (!customSel.contains(e.target)) customSel.classList.remove('open');
    });
}

function showAddTaskCard() {
    const overlay = document.getElementById('addTaskOverlay');
    overlay.classList.add('show');
    document.getElementById('widgetTaskName').value = '';
    document.getElementById('widgetTaskDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('widgetTaskStartTime').value = '';
    document.getElementById('widgetTaskEndTime').value = '';
    document.getElementById('widgetTaskNotes').value = '';
    populateWidgetGroupSelect('widgetTaskGroupCustom', 'widgetTaskGroup', '选择分组或项目');
    populateWidgetPrioritySelect();
    // Set default priority (medium)
    const priCustom = document.getElementById('widgetTaskPriorityCustom');
    const priTrigger = priCustom.querySelector('.w-custom-select-trigger');
    const priOptions = priCustom.querySelectorAll('.w-custom-select-option');
    priOptions.forEach(o => o.classList.remove('selected'));
    const mediumOpt = priCustom.querySelector('[data-value="medium"]');
    if (mediumOpt) {
        mediumOpt.classList.add('selected');
        priTrigger.innerHTML = mediumOpt.innerHTML;
        priTrigger.dataset.value = 'medium';
        document.getElementById('widgetTaskPriority').value = 'medium';
    }
    setTimeout(() => document.getElementById('widgetTaskName').focus(), 100);
}

function hideAddTaskCard() {
    document.getElementById('addTaskOverlay').classList.remove('show');
}

function submitWidgetTask() {
    const name = document.getElementById('widgetTaskName').value.trim();
    if (!name) return;
    const date = document.getElementById('widgetTaskDate').value;
    const priority = document.getElementById('widgetTaskPriority').value;
    const catValue = document.getElementById('widgetTaskGroup').value;
    const startTime = document.getElementById('widgetTaskStartTime').value;
    const endTime = document.getElementById('widgetTaskEndTime').value;
    const notes = document.getElementById('widgetTaskNotes').value.trim();

    let groupId = null;
    let projectId = null;
    if (catValue.startsWith('g_')) {
        groupId = parseInt(catValue.substring(2));
    } else if (catValue.startsWith('p_')) {
        projectId = parseInt(catValue.substring(2));
    }

    const newTodo = {
        id: wUniqueId(),
        text: name,
        completed: false,
        date: date || null,
        priority: priority,
        groupId: groupId,
        projectId: projectId,
        startTime: startTime || null,
        endTime: endTime || null,
        notes: notes || '',
        subtasks: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    };

    data.todos.push(newTodo);
    saveLocalData();
    renderAll();
    syncToggleToCloud();
    ipcRenderer.send('widget-data-changed');
    hideAddTaskCard();
}

// --- 失焦透明 ---
ipcRenderer.on('widget-blur', () => {
    document.getElementById('widget-root').style.opacity = '0.92';
});
ipcRenderer.on('widget-focus', () => {

// --- 工具 ---
function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// --- 随想录 ---
function renderWidgetIdeas() {
    const list = document.getElementById('widgetIdeasList');
    populateWidgetGroupSelect('widgetIdeaLinkCustom', 'widgetIdeaLink', '选择分组或项目');
    // populate existing tag chips
    const tagChipsContainer = document.getElementById('widgetIdeaTagChips');
    const allTags = data.ideaTags || [];
    if (allTags.length > 0) {
        tagChipsContainer.innerHTML = '<span style="font-size:0.6rem;color:var(--text-secondary);margin-right:2px;">已有标签:</span>' + allTags.map(t =>
            `<span class="idea-tag-chip" onclick="addWidgetTag('${escHtml(t).replace(/'/g, "\\'")}')" style="cursor:pointer;padding:1px 6px;border-radius:999px;font-size:0.6rem;font-weight:700;border:1px solid var(--border-color);background:var(--bg-color);color:var(--text-main);">${escHtml(t)}</span>`
        ).join('');
    } else {
        tagChipsContainer.innerHTML = '';
    }

    const ideas = (data.ideas || []).slice().sort((a, b) => {
        if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
        return new Date(b.createdAt) - new Date(a.createdAt);
    });
    if (ideas.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:0.85rem;"><i class="fas fa-lightbulb" style="display:block;font-size:1.5rem;opacity:0.3;margin-bottom:8px;"></i>暂无随想</div>';
        return;
    }
    list.innerHTML = ideas.map(i => {
        const d = new Date(i.createdAt);
        const time = `${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        const tagHtml = (i.tags || []).map(t => `<span style="padding:1px 6px;border-radius:999px;font-size:0.6rem;font-weight:700;background:var(--accent-color);color:var(--accent-contrast);">${escHtml(t)}</span>`).join(' ');
        const linkIcon = i.linkedType === 'task' ? '<i class="fas fa-check-circle"></i>' : i.linkedType === 'project' ? '<i class="fas fa-project-diagram"></i>' : i.linkedType === 'group' ? '<i class="fas fa-folder"></i>' : '';
        const linkHtml = i.linkedName ? `<span style="font-size:0.65rem;color:var(--accent-color);">${linkIcon} ${escHtml(i.linkedName)}</span>` : '';
        const borderLeft = i.pinned ? 'border-left:3px solid var(--warning-color);' : i.important ? 'border-left:3px solid var(--danger-color);' : '';
        return `<div class="widget-idea-card" style="padding:8px 10px;border:1.5px solid var(--border-color);border-radius:var(--radius);background:var(--card-bg);${borderLeft}position:relative;">
            <div style="font-size:0.85rem;line-height:1.5;word-break:break-word;white-space:pre-wrap;">${escHtml(i.text)}</div>
            <div style="display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap;">
                <span style="font-size:0.65rem;color:var(--text-secondary);">${time}</span>
                ${tagHtml}
                ${linkHtml}
                ${i.pinned ? '<i class="fas fa-thumbtack" style="color:var(--warning-color);font-size:0.65rem;"></i>' : ''}
                ${i.important ? '<i class="fas fa-star" style="color:var(--danger-color);font-size:0.65rem;"></i>' : ''}
            </div>
            <button onclick="deleteWidgetIdea(${i.id})" class="widget-idea-del" title="删除"><i class="fas fa-trash"></i></button>
        </div>`;
    }).join('');
}

// --- 自定义确认框 ---
let confirmResolve = null;
function showConfirm(title, message, options = ['取消', '确认']) {
    return new Promise((resolve) => {
        confirmResolve = resolve;
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').innerHTML = message.replace(/\n/g, '<br>');
        const actions = document.getElementById('confirmActions');
        actions.innerHTML = '';
        options.forEach((text, i) => {
            const btn = document.createElement('button');
            btn.className = i === options.length - 1 ? 'btn-sm primary' : 'btn-sm';
            btn.textContent = text;
            btn.addEventListener('click', () => {
                document.getElementById('confirmOverlay').classList.remove('show');
                resolve(i);
            });
            actions.appendChild(btn);
        });
        document.getElementById('confirmOverlay').classList.add('show');
    });
}

window.deleteWidgetIdea = async function(id) {
    const confirmed = await showConfirm('删除随想', '确定要删除这条随想吗？', ['取消', '删除']);
    if (confirmed !== 1) return;
    data.ideas = (data.ideas || []).filter(i => i.id !== id);
    const allTags = new Set();
    (data.ideas || []).forEach(i => (i.tags || []).forEach(t => allTags.add(t)));
    data.ideaTags = [...allTags].sort();
    saveLocalData();
    renderWidgetIdeas();
    ipcRenderer.send('widget-data-changed');
};

window.addWidgetTag = function(tag) {
    const input = document.getElementById('widgetIdeaTags');
    const current = input.value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    if (!current.includes(tag)) {
        current.push(tag);
        input.value = current.join(', ');
    }
};

function widgetAddIdea() {
    const text = document.getElementById('widgetIdeaText').value.trim();
    if (!text) return;
    const tags = document.getElementById('widgetIdeaTags').value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    const linkVal = document.getElementById('widgetIdeaLink').value;
    let linkedId = null, linkedType = null, linkedName = null;
    if (linkVal.startsWith('g_')) {
        const gid = parseInt(linkVal.substring(2));
        const g = (data.groups || []).find(g => g.id === gid);
        linkedId = gid; linkedType = 'group'; linkedName = g ? g.name : '';
    } else if (linkVal.startsWith('p_')) {
        const pid = parseInt(linkVal.substring(2));
        const p = (data.projects || []).find(p => p.id === pid);
        linkedId = pid; linkedType = 'project'; linkedName = p ? p.name : '';
    } else if (linkVal.startsWith('t_')) {
        const tid = parseInt(linkVal.substring(2));
        const t = (data.todos || []).find(t => t.id === tid);
        linkedId = tid; linkedType = 'task'; linkedName = t ? t.text.substring(0, 30) : '';
    }
    if (!data.ideas) data.ideas = [];
    if (!data.ideaTags) data.ideaTags = [];
    data.ideas.unshift({
        id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
        text, tags,
        linkedId, linkedType, linkedName,
        pinned: false, important: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    });
    const allTags = new Set([...data.ideaTags, ...tags]);
    data.ideaTags = [...allTags].sort();
    saveLocalData();
    document.getElementById('widgetIdeaText').value = '';
    document.getElementById('widgetIdeaTags').value = '';
    document.getElementById('widgetIdeaLink').value = '';
    renderWidgetIdeas();
    ipcRenderer.send('widget-data-changed');
}
</script>
